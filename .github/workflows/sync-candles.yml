name: Sync candles

# Replaces the old live Twelve Data chart fetch with a pre-computed
# pipeline: every day this downloads Exness's public tick archive for
# the individual UTC calendar days a logged trade actually spans (entry
# through exit inclusive, across all accounts — chart data is market
# data, not account-scoped), aggregates ticks into OHLC candles at six
# timeframes (1m/5m/15m/1H/4H/1D) using the BID price, and merges the
# result into Cloudflare R2. The Next.js app then reads directly from R2
# at chart-open time instead of calling a live market-data API — see
# app/api/chart-data/route.ts.
#
# DATA SOURCING: only trade-days actually needed, only once closed.
# Older design fetched a whole month's tick zip per instrument and kept
# re-fetching the current month's still-forming data on every run. This
# version fetches only the specific UTC calendar days a real logged
# trade touches, and ONLY once that day has fully passed (UTC
# midnight) — a day's archive file is never downloaded while it could
# still be incomplete, with no tolerance for partial-day data. A day
# whose trade hasn't closed yet simply isn't fetched this run; it's
# picked up automatically once it closes, on a future run. See
# scripts/tradeDays.ts (which days a trade needs, and whether a day has
# closed) and scripts/sync-candles.ts's header comment for the full
# design, including how per-day fetches get merged into the existing
# month-keyed R2 storage layout (unchanged) and tracked via a per-
# instrument synced-days manifest so already-fetched days are never
# re-downloaded.
#
# Runs at 02:00 UTC daily (every day of the week, not just weekdays —
# trades can be logged and need syncing regardless of whether markets
# were open that day; the archive simply has no file for a closed-
# market day, which the existing "skip gracefully" handling already
# covers), 2 hours after UTC midnight so a trade-day that just closed
# gets synced with a safety margin, plus manual dispatch any time from
# the Actions tab. Since the sync only ever fetches days it has
# confirmed are closed, correctness doesn't depend on the exact cron
# time — this margin only affects how soon after a day closes its data
# actually lands in R2.
#
# SETUP (one-time, required for this to work):
#   1. Cloudflare R2:
#      a. Dashboard -> R2 -> Create bucket. Name it anything (e.g.
#         "nocturne-candles") — this becomes R2_BUCKET_NAME below.
#      b. R2 -> Overview -> Account Details -> copy your Account ID —
#         this becomes R2_ACCOUNT_ID below.
#      c. R2 -> Manage R2 API Tokens -> Create API Token. Give it Object
#         Read & Write permission scoped to the bucket you just made.
#         Copy the Access Key ID and Secret Access Key it shows you —
#         you will NOT be able to see the secret again after leaving
#         this page.
#      d. Nothing needs to be made public — the app reads via the same
#         signed S3 API the sync script writes with, not a public URL,
#         so your trade history's instrument list/timing never becomes
#         a public bucket.
#   2. In this GitHub repo: Settings -> Secrets and variables -> Actions
#      -> New repository secret, add each of:
#        - SUPABASE_DB_URL       (same value already used by
#                                  supabase-backup.yml — see that
#                                  workflow's comments for how to get it)
#        - R2_ACCOUNT_ID
#        - R2_ACCESS_KEY_ID
#        - R2_SECRET_ACCESS_KEY
#        - R2_BUCKET_NAME
#   3. In Vercel (or wherever the app is deployed), add the SAME four R2_*
#      env vars (the app needs them too, to read candles at request
#      time — see app/api/chart-data/route.ts).
#   4. Done — the schedule below picks it up automatically. Use "Run
#      workflow" in the Actions tab to backfill immediately rather than
#      waiting for the next scheduled run.
#
# First run only fetches trade-days that already exist and have closed
# — there's no more month-range backfill, so it's no slower than any
# later run. Every run after that only fetches what's actually new
# (newly logged trades, or a previously-open trade's day that has since
# closed), tracked via each instrument's synced-days manifest — an
# instrument with nothing new to sync does nothing but one cheap
# manifest read.
#
# If a step fails (e.g. a secret missing/wrong), the job fails loudly
# and GitHub emails you — check the Actions tab for the error.

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily, every day of the week — see header comment above
  workflow_dispatch: {} # lets you click "Run workflow" in the Actions tab any time

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets are set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          missing=""
          for name in SUPABASE_DB_URL R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            value="${!name}"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing. Add them under Settings -> Secrets and variables -> Actions. See the comments at the top of this workflow file for where to get each value."
            exit 1
          fi

      - name: Sync candles from Exness archive to R2
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: npx tsx scripts/sync-candles.ts
