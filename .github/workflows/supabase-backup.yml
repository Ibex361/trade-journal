name: Supabase backup

# Supabase's free tier doesn't take automatic backups, so this does it
# instead: every Sunday it dumps the "public" schema (all your trade
# data — accounts, trades, dropdown settings, etc.) straight from
# Supabase's Postgres, gzips it, and commits it into this repo under
# backups/. Nothing to run yourself — this runs on GitHub's servers on
# a timer. You can also trigger it manually any time from the Actions
# tab ("Run workflow") if you want a backup right before making some
# risky change.
#
# SETUP (one-time, required for this to work):
#   1. In the Supabase dashboard: Project Settings -> Database ->
#      Connection string -> URI. IMPORTANT: use the "Session pooler" or
#      "Direct connection" string (port 5432), NOT the default
#      "Transaction pooler" (port 6543) — pg_dump does not work
#      reliably against the transaction pooler.
#   2. In this GitHub repo: Settings -> Secrets and variables -> Actions
#      -> New repository secret -> name it SUPABASE_DB_URL, paste the
#      connection string (with your actual password substituted in for
#      the [YOUR-PASSWORD] placeholder Supabase shows you).
#   3. Done — the schedule below picks it up automatically. Use "Run
#      workflow" in the Actions tab to test it immediately rather than
#      waiting for Sunday.
#
# Only the last 12 backups (about 3 months on a weekly schedule) are
# kept — older ones are pruned automatically each run so this doesn't
# grow the repo forever.
#
# Auth/session internals aren't included (only your own app's "public"
# schema is dumped), so this is safe to keep in a private repo without
# leaking Supabase-managed credentials.
#
# If the dump step fails (e.g. secret missing/wrong, or wrong port),
# the job fails loudly and GitHub emails you — check the Actions tab
# for the error rather than assuming a green run happened.

on:
  schedule:
    - cron: "0 4 * * 0" # every Sunday at 04:00 UTC
  workflow_dispatch: {} # lets you click "Run workflow" in the Actions tab any time

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Install PostgreSQL client tools
        # pg_dump must be the same major version as the server (or newer) —
        # Ubuntu's own apt repo only ships one fixed Postgres version (was
        # 16, which broke once Supabase moved to Postgres 17), so this adds
        # the official PGDG apt repo instead, which always carries the
        # latest major version, and installs the unversioned "postgresql-client"
        # meta-package so this keeps working automatically on Supabase's
        # next major-version upgrade too.
        run: |
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify SUPABASE_DB_URL secret is set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set. Add it under Settings -> Secrets and variables -> Actions. See the comments at the top of this workflow file for how to get the connection string from Supabase."
            exit 1
          fi

      - name: Dump the public schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          # Ubuntu 24.04 ships its own pg_dump (v16) at /usr/bin/pg_dump,
          # which the PGDG install above does NOT overwrite or take
          # priority over on PATH — it only adds versioned binaries
          # under /usr/lib/postgresql/<version>/bin/. Resolve the
          # actual newest installed version explicitly so the right
          # one gets used instead of silently falling back to the
          # older system one. Also: without `set -o pipefail`, pg_dump
          # failing here would be masked by `gzip` succeeding on an
          # empty stream, so the step would show green even on failure
          # — pipefail makes the pipeline's exit code reflect pg_dump's.
          PG_BIN_DIR=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n1)
          mkdir -p backups
          stamp=$(date -u +%Y-%m-%d)
          "$PG_BIN_DIR/pg_dump" "$SUPABASE_DB_URL" \
            --schema=public \
            --no-owner \
            --no-privileges \
            --format=plain \
          | gzip > "backups/backup-${stamp}.sql.gz"

      - name: Verify the dump isn't empty
        run: |
          stamp=$(date -u +%Y-%m-%d)
          size=$(stat -c%s "backups/backup-${stamp}.sql.gz")
          if [ "$size" -lt 200 ]; then
            echo "::error::Backup file is suspiciously small (${size} bytes) — the dump likely failed silently. Check that SUPABASE_DB_URL points at the direct connection or session pooler (port 5432), not the transaction pooler (port 6543)."
            exit 1
          fi

      - name: Prune old backups (keep the last 12)
        run: |
          cd backups
          ls -1t backup-*.sql.gz | tail -n +13 | xargs -r rm --

      - name: Commit and push the backup
        run: |
          git config user.name "supabase-backup-bot"
          git config user.email "actions@github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "Nothing changed, skipping commit."
          else
            git commit -m "Weekly Supabase backup: $(date -u +%Y-%m-%d)"
            git push
          fi
